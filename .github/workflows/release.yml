name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the tag must match the version in the code
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/loghunt/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: pip install -e ".[dev]" && pytest
      - run: scripts/build-deb.sh
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "loghunt ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
